name: GameHub checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: gamehub
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: gamehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamehub -d gamehub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GAMEHUB_TEST_DATABASE_URL: postgresql://gamehub:ci-test-only@127.0.0.1:5432/gamehub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:api
      - run: npm run contracts:check
      - run: npx playwright install --with-deps chromium
      - run: npm run platform:browser
        env:
          GAMEHUB_BROWSER: chromium
